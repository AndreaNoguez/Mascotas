<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
                                    initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <link rel="icon" href="Imagenes/icono.png"> <!--es para que aparezca el icono de la huellita a un lado del titulo de la pagina-->
    <title>Registrar Nueva Mascota</title>       
</head>

<body class="fondo">
    <header>
        <h1>
            Guardería de Mascotas
        </h1>
    </header>
    <div>
        <!--Formulario para registrar a la mascota-->
        <form autocomplete="off">
            <fieldset class="formulario"><!--el formulario queda dentro de un campo-->
                <legend>Completa el siguiente formulario para registar una mascota</legend>
                <p class="texto">Datos de la mascota.</p>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" class="inputt"
                        placeholder="Nombre de la mascota" required="true"/>

                <label for="edad">Edad:</label>
                <input type="number" id="edad" min="0" max="30" class="inputt"
                        name="edad" placeholder="Edad" required="true"/>
                
                <label for="especie">Especie:</label>
                <select id="especie" name="especie">
                    <option value="perro">Perro</option>
                    <option value="gato">Gato</option>
                    <option value="pez">Pez</option>
                    <option value="ave">Ave</option>
                    <option value="roedor">Roedor</option>
                </select><br/><br/>

                <label for="sexo">Sexo de la mascota:</label>
                <input type="radio" name="sexo" value="hembra" required="true">
                <label>Hembra</label>
                <input type="radio" name="sexo" value="macho" required="true">
                <label>Macho</label><br/><br/>

                <label for="estado">¿Tu mascota está viva o muerta?</label><br/>
                <input type="radio" name="estado" value="vivo" required="true">
                <label>Mascota viva</label><br/>
                <input type="radio" name="estado" value="muerto" required="true">
                <label>Mascota muerta</label><br/><br/>

                <label for="historia">Por favor escribe su historia:</label><br/>
                <textarea id="historia"name="historia" class="inputt-story"
                        minlength="50" maxlength="200" required="true"></textarea>
                <br><!--saltos de linea-->
                
                <p class="texto">Datos del padre o tutor.</p>
                <label for="nombretutor">Nombre:</label>
                <input type="text" id="nombretutor" name="nombretutor" class="inputt"
                        placeholder="Nombre del tutor" required="true"/>
                
                <label for="apellidopaterno">Apellido Paterno:</label>
                <input type="text" id="apellidopaterno" name="apellidopaterno" class="inputt"
                        placeholder="Apellido paterno del tutor" required="true"/>
                
                <label for="apellidomaterno">Apellido Materno:</label>
                <input type="text" id="apellidomaterno" name="apellidomaterno" class="inputt"
                        placeholder="Apellido materno del tutor" required="true"/><br/><br/>

                <label for="telefono">Telefono:</label>
                <input type="tel" id="telefono" name="telefono" class="inputt"
                        placeholder="Numero de contacto" required="true"
                        minlength="10" maxlength="10"/>

                <label for="correo">Correo:</label>
                <input type="email" id="correo" name="correo" class="inputt"
                        placeholder="Correo electrónico" required="true"/><br/>

                <br><!--saltos de linea-->
                <input type="submit" value="Registrar" class="boton_form"/>

            </fieldset>
        </form>
    </div>
</body>
</html>
